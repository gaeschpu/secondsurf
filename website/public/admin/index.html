<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>Dashboard · secondsurf</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/admin/admin.css" />
		<script src="/admin/admin.js" defer></script>
	</head>
	<body>
		<section id="login" class="card login" role="main" hidden>
			<h1>secondsurf</h1>
			<form id="login-form">
				<label>
					Password
					<input id="password" type="password" name="password" autocomplete="current-password" required />
				</label>
				<p id="login-error" class="error" role="alert" hidden></p>
				<button class="primary" type="submit">Log in</button>
			</form>
		</section>

		<div id="dashboard" hidden>
			<header class="bar">
				<strong>secondsurf</strong>
				<button id="logout" class="link" type="button">Log out</button>
			</header>

			<main>
				<form id="add-form" class="card" novalidate>
					<h1>Add a piece</h1>

					<div class="photo-buttons">
						<label class="button">
							Take photo
							<input class="file" type="file" accept="image/*" capture="environment" />
						</label>
						<label class="button">
							Choose photos
							<input class="file" type="file" accept="image/*" multiple />
						</label>
					</div>
					<ul id="previews" class="previews"></ul>
					<p class="hint">The first photo is the one on the shop card. Tap ★ to make another one first.</p>

					<label>Brand <input name="brand" maxlength="80" autocomplete="off" required /></label>
					<label>Title <input name="title" maxlength="120" autocomplete="off" placeholder="White logo tee" required /></label>
					<label>Category <select name="category" required></select></label>
					<div class="row">
						<label>Size <select name="size" required></select></label>
						<label>Price (CHF) <input name="price" type="number" inputmode="decimal" min="1" step="1" required /></label>
					</div>
					<label>Condition <select name="condition" required></select></label>

					<details>
						<summary>More details (optional)</summary>
						<label>Measurements <input name="measurements" maxlength="200" placeholder="Pit to pit 52 cm, length 70 cm" /></label>
						<label>Description <textarea name="description" rows="3" maxlength="2000"></textarea></label>
						<label class="check"><input name="staffPick" type="checkbox" /> Show in Staff Picks</label>
					</details>

					<p id="add-error" class="error" role="alert" hidden></p>
					<p id="add-status" class="status" role="status" hidden></p>
					<button id="publish" class="primary" type="submit">Publish</button>
				</form>

				<section>
					<h2>Your pieces</h2>
					<p id="list-error" class="error" role="alert" hidden></p>
					<p id="list-status" class="status" role="status" hidden></p>
					<ul id="products" class="products"></ul>
				</section>
			</main>
		</div>

		<noscript>This dashboard needs JavaScript.</noscript>
	</body>
</html>
